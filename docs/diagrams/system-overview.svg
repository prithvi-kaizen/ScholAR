<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">ScholAR system overview</title>
  <desc id="desc">A local browser uses a Next.js frontend and FastAPI backend. The backend manages paper ingestion, multimodal retrieval, answer verification, local storage, and loopback Ollama inference. External acquisition is policy gated.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#12243d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".38"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7dd3fc"/></marker>
    <marker id="gateArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fbbf24"/></marker>
    <style>
      .title{font:700 34px Inter,ui-sans-serif,system-ui;fill:#f8fafc}.sub{font:400 17px Inter,ui-sans-serif,system-ui;fill:#b8c7dc}
      .box{rx:20;stroke-width:2;filter:url(#shadow)}.h{font:700 21px Inter,ui-sans-serif,system-ui;fill:#f8fafc}.t{font:400 15px Inter,ui-sans-serif,system-ui;fill:#d8e2f0}.small{font:500 13px Inter,ui-sans-serif,system-ui;fill:#b8c7dc}
      .flow{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#arrow)}.gate{fill:none;stroke:#fbbf24;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#gateArrow)}
    </style>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="70" y="66" class="title">ScholAR — local, source-scoped scientific QA</text>
  <text x="70" y="98" class="sub">The backend owns evidence identity, retrieval, citations, and policy; models only transform supplied context.</text>

  <rect x="70" y="170" width="250" height="190" class="box" fill="#172554" stroke="#60a5fa"/>
  <text x="195" y="214" text-anchor="middle" class="h">Browser</text>
  <text x="195" y="252" text-anchor="middle" class="t">Next.js 15 + React 19</text>
  <text x="195" y="280" text-anchor="middle" class="t">PDF reader and study UI</text>
  <text x="195" y="308" text-anchor="middle" class="t">Chat, citations, snippets</text>
  <text x="195" y="336" text-anchor="middle" class="small">localhost:3000</text>

  <rect x="430" y="140" width="530" height="250" class="box" fill="#123047" stroke="#22d3ee"/>
  <text x="695" y="184" text-anchor="middle" class="h">FastAPI application</text>
  <rect x="460" y="215" width="140" height="115" rx="14" fill="#164e63" stroke="#67e8f9"/>
  <text x="530" y="248" text-anchor="middle" class="t">Ingestion</text><text x="530" y="274" text-anchor="middle" class="small">Docling</text><text x="530" y="296" text-anchor="middle" class="small">PyMuPDF</text>
  <rect x="625" y="215" width="140" height="115" rx="14" fill="#164e63" stroke="#67e8f9"/>
  <text x="695" y="248" text-anchor="middle" class="t">Retrieval</text><text x="695" y="274" text-anchor="middle" class="small">text + crop</text><text x="695" y="296" text-anchor="middle" class="small">full-page pixels</text>
  <rect x="790" y="215" width="140" height="115" rx="14" fill="#164e63" stroke="#67e8f9"/>
  <text x="860" y="248" text-anchor="middle" class="t">Answering</text><text x="860" y="274" text-anchor="middle" class="small">generation</text><text x="860" y="296" text-anchor="middle" class="small">verify + trace</text>
  <text x="695" y="366" text-anchor="middle" class="small">localhost:8000 · one production AnswerPipelineService</text>

  <rect x="1070" y="170" width="260" height="190" class="box" fill="#3b1d57" stroke="#c084fc"/>
  <text x="1200" y="214" text-anchor="middle" class="h">Local models</text>
  <text x="1200" y="252" text-anchor="middle" class="t">Ollama generator / VLM</text>
  <text x="1200" y="280" text-anchor="middle" class="t">Cached HF encoders</text>
  <text x="1200" y="308" text-anchor="middle" class="t">Optional Docling assets</text>
  <text x="1200" y="336" text-anchor="middle" class="small">loopback + cache only</text>

  <path d="M320 265H430" class="flow"/><path d="M960 265H1070" class="flow"/>
  <path d="M430 310H325" class="flow"/>

  <rect x="150" y="505" width="500" height="210" class="box" fill="#15362d" stroke="#34d399"/>
  <text x="400" y="550" text-anchor="middle" class="h">Local data boundary</text>
  <text x="190" y="592" class="t">• paper PDF + metadata + EvidenceAST</text>
  <text x="190" y="623" class="t">• chunks, figures, page images, SQLite</text>
  <text x="190" y="654" class="t">• checksummed embedding indexes</text>
  <text x="190" y="685" class="t">• typed answer traces</text>

  <rect x="790" y="505" width="460" height="210" class="box" fill="#4a3214" stroke="#fbbf24"/>
  <text x="1020" y="550" text-anchor="middle" class="h">Explicit acquisition boundary</text>
  <text x="830" y="592" class="t">arXiv search and paper download</text>
  <text x="830" y="623" class="t">reference resolution and download</text>
  <text x="830" y="654" class="t">model, parser, and dataset acquisition</text>
  <text x="830" y="687" class="small">blocked in strict-local mode</text>

  <path d="M585 390V505" class="flow"/>
  <path d="M805 390C805 445 1020 445 1020 505" class="gate"/>
  <rect x="70" y="756" width="1260" height="34" rx="17" fill="#0f1f34" stroke="#334b68"/>
  <text x="700" y="779" text-anchor="middle" class="small">Source paper + local evidence ID remain attached through retrieval, generation, citation, verification, telemetry, and release evaluation.</text>
</svg>
