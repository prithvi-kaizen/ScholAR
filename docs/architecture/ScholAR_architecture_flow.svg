<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f3a4a"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4f7f2a"/>
    </marker>
    <style>
      .bg { fill: #f2ecdf; }
      .title { font-family: Inter, Arial, sans-serif; font-size: 50px; font-weight: 800; fill: #1e1a16; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 500; fill: #665c50; }
      .section-title { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #3a3128; letter-spacing: 1.5px; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 21px; font-weight: 750; fill: #191714; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #4e463d; }
      .tiny { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #5f554b; }
      .pill { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 750; fill: #263018; }
      .box { fill: #fffaf1; stroke: #bda98f; stroke-width: 2; rx: 18; }
      .frontend { fill: #eef5ef; stroke: #88a982; stroke-width: 2; rx: 20; }
      .backend { fill: #eef3fb; stroke: #88a4c5; stroke-width: 2; rx: 20; }
      .service { fill: #ffffff; stroke: #9eb3cf; stroke-width: 2; rx: 14; }
      .store { fill: #f8f1e4; stroke: #bda98f; stroke-width: 2; rx: 16; }
      .external { fill: #f7eef6; stroke: #bd88b4; stroke-width: 2; rx: 18; }
      .eval { fill: #eff7f6; stroke: #7db2aa; stroke-width: 2; rx: 18; }
      .arrow { fill: none; stroke: #2f3a4a; stroke-width: 3; marker-end: url(#arrow); }
      .arrow2 { fill: none; stroke: #4f7f2a; stroke-width: 3; marker-end: url(#arrowGreen); }
      .dash { fill: none; stroke: #7b7065; stroke-width: 2.5; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #2f3a4a; stroke-width: 2.2; marker-end: url(#arrow); }
      .note { fill: #fff4cf; stroke: #c09c42; stroke-width: 2; rx: 14; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1250"/>
  <text class="title" x="70" y="82">ScholAR System Architecture and Flow</text>
  <text class="subtitle" x="72" y="117">Implemented full-stack GenAI research paper assistant: Next.js frontend, FastAPI backend, local PDF processing, BM25-primary retrieval, local Ollama Qwen (text + vision), and evidence citations.</text>

  <!-- User -->
  <rect class="box" x="70" y="180" width="270" height="160"/>
  <text class="section-title" x="95" y="214">USER</text>
  <circle cx="130" cy="270" r="30" fill="#d8e7c3" stroke="#6e9449" stroke-width="2"/>
  <text class="label" x="178" y="258">Student / Researcher</text>
  <text class="small" x="178" y="286">Searches arXiv, uploads PDFs,</text>
  <text class="small" x="178" y="310">asks paper questions</text>

  <!-- Frontend -->
  <rect class="frontend" x="430" y="155" width="470" height="305"/>
  <text class="section-title" x="460" y="190">FRONTEND, NEXT.JS + TYPESCRIPT</text>
  <rect class="box" x="465" y="220" width="185" height="72"/>
  <text class="label" x="490" y="252">Home Page</text>
  <text class="tiny" x="490" y="274">Search, upload, cards</text>
  <rect class="box" x="675" y="220" width="185" height="72"/>
  <text class="label" x="700" y="252">Paper Modal</text>
  <text class="tiny" x="700" y="274">Study with AI</text>
  <rect class="box" x="465" y="320" width="185" height="82"/>
  <text class="label" x="490" y="352">PDF Viewer</text>
  <text class="tiny" x="490" y="374">Page images, zoom,</text>
  <text class="tiny" x="490" y="392">citation highlight</text>
  <rect class="box" x="675" y="320" width="185" height="82"/>
  <text class="label" x="700" y="352">Study Panel</text>
  <text class="tiny" x="700" y="374">ScholAR goals, chat,</text>
  <text class="tiny" x="700" y="392">Local-only chat</text>
  <rect class="note" x="505" y="420" width="315" height="24"/>
  <text class="pill" x="525" y="437">Bookmarks and recent papers use browser localStorage</text>

  <!-- Backend main -->
  <rect class="backend" x="1010" y="150" width="475" height="355"/>
  <text class="section-title" x="1040" y="185">BACKEND, FASTAPI</text>
  <rect class="service" x="1045" y="215" width="190" height="72"/>
  <text class="label" x="1070" y="247">API Routes</text>
  <text class="tiny" x="1070" y="269">/api/search, /prepare,</text>
  <text class="tiny" x="1070" y="286">/upload, /chat</text>
  <rect class="service" x="1260" y="215" width="190" height="72"/>
  <text class="label" x="1285" y="247">Paper APIs</text>
  <text class="tiny" x="1285" y="269">metadata, PDF, page PNG,</text>
  <text class="tiny" x="1285" y="286">study goals</text>
  <rect class="service" x="1045" y="318" width="190" height="78"/>
  <text class="label" x="1070" y="350">Local Routing</text>
  <text class="tiny" x="1070" y="372">Ollama availability,</text>
  <text class="tiny" x="1070" y="390">timeout fallback</text>
  <rect class="service" x="1260" y="318" width="190" height="78"/>
  <text class="label" x="1285" y="350">Evidence Builder</text>
  <text class="tiny" x="1285" y="372">Evidence IDs, quotes,</text>
  <text class="tiny" x="1285" y="390">numbered citations</text>
  <rect class="note" x="1060" y="425" width="385" height="44"/>
  <text class="pill" x="1083" y="451">CORS enabled for local Next.js frontend</text>

  <!-- External systems -->
  <rect class="external" x="1530" y="170" width="210" height="78"/>
  <text class="label" x="1560" y="204">arXiv API</text>
  <text class="tiny" x="1560" y="228">Paper search + PDF URL</text>
  <rect class="external" x="1530" y="285" width="210" height="78"/>
  <text class="label" x="1560" y="319">Ollama (local)</text>
  <text class="tiny" x="1560" y="343">On-device text + vision</text>
  <rect class="external" x="1530" y="400" width="210" height="78"/>
  <text class="label" x="1560" y="434">Web Search</text>
  <text class="tiny" x="1560" y="458">DuckDuckGo HTML</text>

  <!-- Processing pipeline -->
  <rect class="backend" x="105" y="555" width="1110" height="260"/>
  <text class="section-title" x="135" y="590">PDF PREPARATION AND PAPER PROCESSING PIPELINE</text>
  <rect class="service" x="145" y="635" width="165" height="90"/>
  <text class="label" x="170" y="667">Input Paper</text>
  <text class="tiny" x="170" y="691">arXiv PDF URL</text>
  <text class="tiny" x="170" y="710">or uploaded PDF</text>
  <rect class="service" x="350" y="635" width="165" height="90"/>
  <text class="label" x="372" y="667">pdf_service</text>
  <text class="tiny" x="372" y="691">Download, save,</text>
  <text class="tiny" x="372" y="710">render pages</text>
  <rect class="service" x="555" y="635" width="165" height="90"/>
  <text class="label" x="578" y="667">PyMuPDF</text>
  <text class="tiny" x="578" y="691">Extract text</text>
  <text class="tiny" x="578" y="710">page by page</text>
  <rect class="service" x="760" y="635" width="165" height="90"/>
  <text class="label" x="782" y="667">chunking</text>
  <text class="tiny" x="782" y="691">Page-preserving</text>
  <text class="tiny" x="782" y="710">chunks + metadata</text>
  <rect class="store" x="965" y="625" width="210" height="112"/>
  <text class="label" x="995" y="657">Local Storage</text>
  <text class="tiny" x="995" y="681">paper.pdf</text>
  <text class="tiny" x="995" y="701">metadata.json</text>
  <text class="tiny" x="995" y="721">pages.json, chunks.json</text>
  <path class="arrow" d="M310 680 L350 680"/>
  <path class="arrow" d="M515 680 L555 680"/>
  <path class="arrow" d="M720 680 L760 680"/>
  <path class="arrow" d="M925 680 L965 680"/>

  <!-- Study and RAG flow -->
  <rect class="backend" x="105" y="870" width="1520" height="270"/>
  <text class="section-title" x="135" y="905">STUDY, RETRIEVAL, GENERATION, AND CITATION FLOW</text>
  <rect class="service" x="145" y="950" width="180" height="90"/>
  <text class="label" x="170" y="982">Study Page</text>
  <text class="tiny" x="170" y="1006">User clicks goal</text>
  <text class="tiny" x="170" y="1025">or asks a question</text>
  <rect class="service" x="365" y="950" width="210" height="90"/>
  <text class="label" x="390" y="982">Load chunks.json</text>
  <text class="tiny" x="390" y="1006">Existing prepared</text>
  <text class="tiny" x="390" y="1025">paper evidence</text>
  <rect class="service" x="615" y="950" width="230" height="90"/>
  <text class="label" x="640" y="982">BM25-primary</text>
  <text class="tiny" x="640" y="1006">Retrieve + rerank</text>
  <text class="tiny" x="640" y="1025">page, section, phrase hints</text>
  <rect class="service" x="885" y="950" width="215" height="90"/>
  <text class="label" x="910" y="982">Prompt Builder</text>
  <text class="tiny" x="910" y="1006">Evidence IDs E1, E2</text>
  <text class="tiny" x="910" y="1025">structured answer rules</text>
  <rect class="service" x="1140" y="920" width="215" height="70"/>
  <text class="label" x="1165" y="952">Local Ollama</text>
  <text class="tiny" x="1165" y="974">Qwen model</text>
  <rect class="service" x="1140" y="1010" width="215" height="70"/>
  <text class="label" x="1165" y="1042">Local Ollama Vision</text>
  <text class="tiny" x="1165" y="1064">Figure/table QA path</text>
  <rect class="service" x="1395" y="950" width="185" height="90"/>
  <text class="label" x="1420" y="982">Answer UI</text>
  <text class="tiny" x="1420" y="1006">Numbered references</text>
  <text class="tiny" x="1420" y="1025">Click to highlight PDF</text>
  <path class="arrow" d="M325 995 L365 995"/>
  <path class="arrow" d="M575 995 L615 995"/>
  <path class="arrow" d="M845 995 L885 995"/>
  <path class="arrow" d="M1100 995 C1120 965 1120 955 1140 955"/>
  <path class="arrow" d="M1100 995 C1120 1028 1120 1045 1140 1045"/>
  <path class="arrow" d="M1355 955 C1375 965 1378 985 1395 995"/>
  <path class="arrow" d="M1355 1045 C1375 1030 1378 1010 1395 995"/>

  <!-- Study goals branch -->
  <rect class="eval" x="1280" y="555" width="370" height="260"/>
  <text class="section-title" x="1310" y="590">STUDY PLAN GENERATION</text>
  <rect class="service" x="1320" y="635" width="285" height="72"/>
  <text class="label" x="1345" y="667">/study-goals</text>
  <text class="tiny" x="1345" y="690">Local Ollama only</text>
  <rect class="service" x="1320" y="725" width="285" height="64"/>
  <text class="label" x="1345" y="756">Canonical goals JSON</text>
  <text class="tiny" x="1345" y="778">8 goals + recursive subquestions</text>
  <path class="arrow2" d="M1175 705 C1230 705 1260 670 1320 670"/>
  <path class="arrow2" d="M1463 707 L1463 725"/>
  <path class="dash" d="M1463 789 C1463 845 270 840 235 950"/>

  <!-- Connections between major blocks -->
  <path class="arrow" d="M340 260 L430 260"/>
  <path class="arrow" d="M900 255 L1010 255"/>
  <path class="arrow" d="M1235 250 L1530 210"/>
  <path class="arrow" d="M1530 210 C1490 210 1490 640 310 640"/>
  <path class="arrow" d="M900 365 L1010 365"/>
  <path class="arrow" d="M1175 737 C1175 810 510 850 470 950"/>
  <path class="arrow" d="M1580 995 C1700 995 1700 395 1530 435"/>
  <path class="dash" d="M900 430 C930 520 970 585 1065 625"/>
  <path class="dash" d="M965 737 C910 795 640 850 470 950"/>
  <path class="dash" d="M1395 1018 C980 1175 610 500 560 402"/>

  <!-- Legend -->
  <rect class="box" x="70" y="1165" width="1460" height="55"/>
  <text class="section-title" x="95" y="1199">LEGEND</text>
  <line x1="190" y1="1194" x2="245" y2="1194" class="arrow"/>
  <text class="tiny" x="260" y="1199">API or data flow</text>
  <line x1="405" y1="1194" x2="460" y2="1194" class="arrow2"/>
  <text class="tiny" x="475" y="1199">Study goal planning flow</text>
  <line x1="680" y1="1194" x2="735" y2="1194" class="dash"/>
  <text class="tiny" x="750" y="1199">Local file or UI reference flow</text>
  <rect class="service" x="1000" y="1178" width="42" height="22"/>
  <text class="tiny" x="1055" y="1195">Backend service</text>
  <rect class="external" x="1200" y="1178" width="42" height="22"/>
  <text class="tiny" x="1255" y="1195">External service</text>
</svg>
