name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-setup-and-build:
    name: Clean setup and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run the documented clean setup
        run: make setup
      - name: Diagnose the installed environment
        run: make doctor
      - name: Compile Python and typecheck frontend
        run: make check
      - name: Build the production frontend
        run: make frontend-build
      - name: Import the API application
        run: .venv/bin/python -c "from backend.main import app; assert app.title == 'ScholAR API'"
